<div class="flex justify-center font-roboto">
    <div class="w-4/5 bg-white h-lvh gap-x-3 p-6 flex justify-center">
        <div class="flex justify-center flex-col w-full">
            <p class="font-germania text-5xl text-center uppercase">{B}</p>
            <span class="uppercase text-center font-bold mt-1.5"> Blogadag </span>
            <h2 class="text-center font-mono mt-4">Sign in to your account</h2>
            <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
                <form class="space-y-6" action="#" method="POST">
                    <div>
                        <div class="mt-2">
                            <label for="email" class="block text-sm/6 font-medium text-gray-900">Email address</label>

                            <input type="email" name="email" id="email" autocomplete="email" required
                                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                        </div>
                        <div class="mt-4 flex items-center justify-between flex-wrap">
                            <label for="password" class="block text-sm/6 font-medium text-gray-900">Password</label>
                            <div class="text-sm">
                                <a href="/forgot-password"
                                    class="font-semibold text-indigo-600 hover:text-indigo-500">Forgot password?</a>
                            </div>
                            <input type="password" name="password" id="password" autocomplete="current-password"
                                required
                                class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                        </div>
                        <div class="mt-4">
                            <button type="submit"
                                class="flex w-full justify-center cursor-pointer rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                Sign in
                            </button>
                        </div>
                    </div>
                </form>
                <p class="mt-10 text-center text-sm/6 text-gray-500">
                    Don't have an account?
                    <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">
                        Register
                    </a>
                </p>
            </div>
        </div>
    </div>

    <div class="w-full bg-violet-500 h-lvh">
        <p>Column 1</p>
    </div>
</div>
